name: CI

# Trigger on push or pull request for main, dev, or any feature branches
on:
  push:
    branches:
      - main
      - dev
      - '**/feature/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]  # Use your preferred Node.js version

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Run lint (optional but recommended)
      - name: Run ESLint
        run: npm run lint

      # 5. Run TypeScript type check
      - name: Type-check
        run: npm run type-check

      # 6. Run Jest tests
      - name: Run Jest Tests
        run: npm test
