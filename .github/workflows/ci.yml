name: CI

on:
  push:
    branches:
      - main
      - dev
      - '**/feature/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        id: tsc
        run: npm run type-check > tsc_output.txt 2>&1 || true

      - name: Create TypeScript Annotations
        if: steps.tsc.outcome == 'failure'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('tsc_output.txt', 'utf8');
            const lines = output.split('\n');
            const annotations = [];
            
            const regex = /(.+?)\((\d+),(\d+)\):\s+error\s+TS\d+:\s+(.*)/;

            for (const line of lines) {
              const match = line.match(regex);
              if (match) {
                const [_, file, startLine, startColumn, message] = match;
                annotations.push({
                  path: file.trim(),
                  start_line: parseInt(startLine),
                  end_line: parseInt(startLine),
                  start_column: parseInt(startColumn),
                  end_column: parseInt(startColumn),
                  annotation_level: 'failure',
                  message: message.trim(),
                });
              }
            }

            if (annotations.length > 0) {
              core.summary
                .addHeading('TypeScript Errors Found')
                .addTable([
                  [{data: 'File', header: true}, {data: 'Error', header: true}],
                  ...annotations.map(a => [
                    `${a.path}:${a.start_line}`,
                    a.message
                  ])
                ])
                .write()
            }
            
            core.setFailed(`TypeScript check failed with ${annotations.length} errors.`);

      - name: Run Jest Tests
        run: npm test

      - name: Upload Jest Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: jest-results
          path: ./jest-results
